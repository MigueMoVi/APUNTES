<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tarea 3-A: Ejercicio 4 </title>
    <style>
        body { font-family: Arial;  display: grid ;grid-template-rows: auto auto;}
        li { cursor: pointer; padding: .4rem 0; }
		.trabajo { max-width: 480px; margin: 2rem auto; }
        .completada { text-decoration: line-through; color: gray; }
		.aparte {background-color: #d3dcde;}
		
		
		/* Estilos para la Actividad 2 */
		.error { color: red; font-weight: bold; margin: 0.5rem 0; }
		.borde-rojo { border: 2px solid red; outline: none; }
		
		
		/* ACTIVIDAD 3*/
		#contenedor-filtros{
			display: flex;
			flex-direction: columns;
			gap: 3em;
			justify-content: center;
		}
		
		.oculto {
		  display: none !important;
		}

		/* Estilo opcional para marcar tareas completadas */
		li.completada .texto {
		  text-decoration: line-through;
		  opacity: 0.6;
		}

		/* Botón activo */
		.btn-filtro.activo {
		  background-color: #007bff;
		  color: #fff;
		}
		
		
		
    </style>
</head>
<body>
    
	
	<div class = "trabajo">
		<h1 id="titulo" style = "text-align: center;">Mis tareas</h1>
		<form id="form-tarea">
			<input type="text" id="input-tarea" placeholder="Nueva tarea">
			<button type="submit">Agregar</button>
		</form>
		
		<ul id="lista"></ul>
		<!--
		Se crean elementos como este
			<li>
				<span class="texto">SDFASD</span>
				<button class="btn-eliminar">X</button>
			</li>
		-->
	</div>
	
	<div class = "aparte">
		<!-- actividad 1-->
		<p id = "contador"> Pendientes: X de Y </p>
		<!-- Se debe crear un elemento error -->
	</div>
	
	
	
	<!-- ACTIVIDAD 3 -->
	<div id="contenedor-filtros">
	  <button data-filtro="todas" class="btn activo">Todas</button>
	  <button data-filtro="pendientes" class="btn">Pendientes</button>
	  <button data-filtro="completadas" class="btn">Completadas</button>
	</div>
	
<!--
Cree una función actualizarContador() que calcule los valores con
querySelectorAll (por ejemplo #lista li:not(.completada)) y llámela
cada vez que se agregue, complete o elimine una tarea.
-->

	
</body>
    <script>
        // 1. Selección de elementos
        const form  = document.querySelector('#form-tarea');
        const input = document.querySelector('#input-tarea');
        const lista = document.querySelector('#lista');
		
		
		// ================ ACTIVIDAD 1 ================
		// Referencia a string
		const textContador = document.getElementById("contador");
		// Referencia al botón
		//const btnSubmit = document.querySelector('button[type="submit"]');
			
		// función
		function actualizarContador(){
			const totales = document.querySelectorAll('#lista li').length;
            const pendientes = document.querySelectorAll('#lista li:not(.completada)').length;
			// Actualizar texto en pantalla
			textContador.textContent = ` Pendientes: ${pendientes} de ${totales} `;
		}	
		
		/*querySelector o querySelectorAll es para buscar un elemento o elementos exactos, si se usa getElemetnsClassName se está pasando una lista*/
		
		// ---------------- EJERCICIO 2 --------------------
		const contenedor_error = document.querySelector(".aparte");

		function mostrarError(mensaje) {
			// Si ya existe un error en pantalla, no creamos otro repetido
			if (document.querySelector(".error")) return;

			// 1. Crear el elemento <p class="error"> con su mensaje
			const elem_error = document.createElement('p');
			elem_error.classList.add('error'); 
			elem_error.textContent = mensaje;
			contenedor_error.appendChild(elem_error);

			// 2. Agregar la clase de borde rojo al input
			input.classList.add('borde-rojo');
		}

		function eliminarError() {
			const borrar = document.querySelector(".error");
			if (borrar) {
				borrar.remove();
			}
			// Quitar la clase del borde rojo del input
			input.classList.remove('borde-rojo');
		}

		// Evento 'input': Limpia el error en cuanto el usuario vuelve a escribir
		input.addEventListener('input', () => {
			eliminarError();
		});
		
		
		// ---------------- EJERCICIO 3 --------------------
		// Usar un único listener para el contenedor
		const contenedorFiltros = document.getElementById('contenedor-filtros');
		
		contenedorFiltros.addEventListener('click', (e) => {
		  // 1. Detectar el botón clicado usando dataset.filtro
		  const botonClickeado = e.target.closest('[data-filtro]');
		  if (!botonClickeado) return;

		  const filtro = botonClickeado.dataset.filtro;

		  // 2. Resaltar el botón activo con classList
		  const botones = contenedorFiltros.querySelectorAll('[data-filtro]');
		  botones.forEach(btn => btn.classList.remove('activo'));
		  botonClickeado.classList.add('activo');

		  // 3. Obtener todas las tareas de la lista (incluyendo las creadas dinámicamente)
		  const tareas = lista.querySelectorAll('li');

		  // 4. Filtrar cada <li> según corresponda
		  tareas.forEach(tarea => {
			// Verificamos si el <li> tiene la clase "completada"
			const esCompletada = tarea.classList.contains('completada');

			switch (filtro) {
			  case 'todas':
				tarea.classList.remove('oculto');
				break;
			  case 'pendientes':
				tarea.classList.toggle('oculto', esCompletada);
				break;
			  case 'completadas':
				tarea.classList.toggle('oculto', !esCompletada);
				break;
			}
		  });
		});
		
		
		
		// ---------------- EJERCICIO 4 --------------------
		lista.addEventListener('dblclick', (e) => {
			const spanTexto = e.target.closest('.texto');
			if (!spanTexto) return;

			const textoOriginal = spanTexto.textContent;

			// 1. Crear el input de edición
			const inputEdicion = document.createElement('input');
			inputEdicion.type = 'text';
			inputEdicion.value = textoOriginal;
			inputEdicion.className = 'input-editar';

			// 2. Reemplazar span por input usando replaceWith
			spanTexto.replaceWith(inputEdicion);
			inputEdicion.focus();

			// Evitar que el dblclick se propague al li
			e.stopPropagation();

			// 3. Listener de teclado para Enter y Escape
			inputEdicion.addEventListener('keydown', (event) => {
				if (event.key === 'Enter') {
					const nuevoTexto = inputEdicion.value.trim();
					const nuevoSpan = document.createElement('span');
					nuevoSpan.className = 'texto';
					
					// Si el usuario deja la tarea vacía al editar, conserva el texto original
					nuevoSpan.textContent = nuevoTexto !== '' ? nuevoTexto : textoOriginal;
					
					inputEdicion.replaceWith(nuevoSpan);
				} else if (event.key === 'Escape') {
					const spanOriginal = document.createElement('span');
					spanOriginal.className = 'texto';
					spanOriginal.textContent = textoOriginal;
					
					inputEdicion.replaceWith(spanOriginal);
				}
			});
		});
		
		
		
		
		
		
        // 2. Crear un <li> por cada tarea
        function crearTarea(texto) {
            const li = document.createElement('li');
            const span = document.createElement('span');
            span.className = 'texto';
            span.textContent = texto;               // textContent: seguro ante HTML

            const btn = document.createElement('button');
            btn.className = 'btn-eliminar';
            btn.textContent = 'X';

            li.append(span, ' ', btn);
            lista.append(li);
			
			// Actividad 1
			actualizarContador()
        }

		// 3. Evento submit del formulario (Modificar)
		form.addEventListener('submit', (e) => {
			e.preventDefault(); 
			
			const valorTarea = input.value.trim();

			// VALIDACIÓN 1: Impedir tareas vacías
			if (valorTarea === "") {
				mostrarError("No puedes agregar una tarea vacía.");
				return; // Detiene la ejecución
			}

			// VALIDACIÓN 2: Impedir tareas repetidas (sin distinguir mayúsculas)
			// Obtenemos los textos de los span de la lista actual y los pasamos a minúsculas
			const tareasExistentes = Array.from(document.querySelectorAll('#lista .texto'))
										  .map(span => span.textContent.toLowerCase());

			if (tareasExistentes.includes(valorTarea.toLowerCase())) {
				mostrarError("Esta tarea ya existe en la lista.");
				return; // Detiene la ejecución
			}

			// Si pasa las validaciones, se crea la tarea con éxito
			crearTarea(valorTarea);
			input.value = '';
			input.focus(); 
		});


		// 4. Delegación de eventos: un solo listener para toda la lista
        lista.addEventListener('click', (e) => {
            const li = e.target.closest('li');
            if (!li) return;

            if (e.target.matches('.btn-eliminar')) {
                li.remove();                        // eliminar la tarea
				// ACTIVIDAD 1
				actualizarContador()
				
            } else {
                li.classList.toggle('completada');  // marcar / desmarcar
				// ACTIVIDAD 1
				actualizarContador()
            }
        });
    </script>

</html>
