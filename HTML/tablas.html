<!DOCTYPE html>
<html>
	<title> TABLAS </title>

			<th>Header 2</th>
			<th>Header 3</th>
			<th>Header 4</th>
		</tr>

			<td>a</td>
			<td>a</td>
			<td>a</td>

		</tr>

			<td>Elem 24</td>
		</tr>

			<td>Elem 31</td>

	</table>
