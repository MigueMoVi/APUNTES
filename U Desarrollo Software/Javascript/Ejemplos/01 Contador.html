<!DOCTYPE html>

<html>

<head>
	<title>Contador con JS</title>
	<meta char = "utf-8">
	<style>
		.label-container{
		display: block;
			font-size: 8em;
			margin: 10px;
			/*background-color: green;/**/
			text-align: center;
		}
		/*Espacio de p es grande (se usa 8em crece más todavía)*/
		.label-container p {
			margin: 0;
		}

		.buttons-container{
			/*background-color: blue;/**/
			font-size: 2em;
			text-align: center;
		}
		.buttons{
			background-color: #a9e3f5;
			padding: 10px;
			font-size: 0.8em;
		}
		.buttons:hover{
			background-color: #53e061;
		}
			
	</style>
</head>

<body>
	<h1>Contador</h1>
	
	<div class = "label-container">
		<p id = "lb_contador">0</p>
	</div>
	<div class = "buttons-container">
		<button type = "text" class = "buttons" id = "btnDecrease"> Decrease </button>
		<button type = "text" class = "buttons" id = "btnReset"> Reset </button>
		<button type = "text" class = "buttons" id = "btnIncrease"> Increase </button>
	</div>
	
	<br>
	<a
		href = "../index.html"
		target = "_self"
		> Regresar a incio
	</a>
	
</body>


<!-- ACA ESTÁ EL CÓDIGO JS -->
<script>
	// Obtenemos la REFERENCIA a los nodos del árbol DOM objetos de los botones y el texto a cambiar
	const DecreaseBtn = document.getElementById("btnDecrease");
	const ResetBtn = document.getElementById("btnReset");
	const IncreaseBtn = document.getElementById("btnIncrease");
	const Label = document.getElementById("lb_contador");
	
	let NUM = 0;
	
	// Usar funciones anónimas para obtener los eventos y luego hacer los cambios
	IncreaseBtn.onclick = function(){
		NUM++;
		Label.textContent = NUM;
	}
	
	DecreaseBtn.onclick = function(){
		NUM--;
		Label.textContent = NUM;
	}
	
	ResetBtn.onclick = function(){
		NUM = 0;
		Label.textContent = 0;
	}
	
	// Se podría hacer casting obteniedo el valor del label, convertirlo a número, realizar la operación sobre una variable
	// y luego cambiar el valor...
	
	
	
</script>


</html>
